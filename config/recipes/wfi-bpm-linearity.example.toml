# Native command from orchestration, after qualification and input review:
# mefpp_recipe cal bpm-linearity --config bpm-linearity.toml --qc false
# Project owns all roots; this template changes no active controls or data.
# Use a fresh empty reduced run and a fresh control-directory basename.
# WFI CHIP1: provisional two-level engineering test, not a full linearity sequence.
# Rectangular ROIs are in the processing profile; sites below are individual pixels.
# The center site below is a candidate requiring review.
bpm_linearity_recipe_schema_version = 2
project = "project.toml"
settings = "bias.toml"
run = "cal/bpm-linearity/wfi-native-001"
qc = false # omitted defaults to true; CLI overrides this value

[assembly]
reference_detector = "WIN1.CHIP1.OUT1"

[preparation]
detector_toml = "wfi-1x1.toml"
processing_toml = "wfi-characterization.toml"

[bpm]
acquisition = "provisional"
output_mode = "new"
upper_fraction = 0.85
minimum_span_fraction = 0.15
maximum_pair_difference = 0.02
response_low = 0.5 # default
response_high = 1.5 # default

[inputs]
# Replace with the absolute path to your processing list.
list = "/absolute/path/to/wfi-linearity.list"

[[detectors]]
detector_id = "WIN1.CHIP1.OUT1"
configuration_detector = 0
hdu = 1
readout_id = "WFI:normal:1x1"
# Calibration paths are relative to the project calibration root.
master_bias = "bias/main-acceptance-3ug8nsjh/CMDP.2026-11-09T15:14:23.370Z.001.fits"
master_hdu = 1
master_sha256 = "REPLACE_WITH_ACTUAL_MASTER_SHA256"
input_bpm = "omitted" # alternatively an explicit calibration path, with bpm_hdu
reference_rois = ["CHIP1.near_readout", "CHIP1.serial_far", "CHIP1.parallel_far", "CHIP1.far_corner", "CHIP1.center"]
max_loaded_pixels = 60000000
max_rows = 20

[[detectors.sites]]
roi = "CHIP1.center"
x = 1022
y = 2049
