# Standalone bias processing envelope; existing numerical settings are referenced.
# Copy beside the already qualified native bias.toml; do not replace that file.
bias_recipe_schema_version = 1
settings = "bias.toml"

[bias]
# Default: average the two central samples when an even number is retained.
median_even_handling = "average"
# Omit this field for the same default, or use an explicit ID array.
detectors = "all"
mad = true
ron_pair = [0, 1]
high_sigma = 5.0
readout_id = "OMEGACAM:normal:ordered:1x1"
bin_x = 1
bin_y = 1
# Retained structural BPM for this project; change explicitly for another project.
input_bpm = "/Users/fselman/Pictures/OCAM/wenu-imaging/legacy-bpm-structure-b1h9egzp/prepared/OCAM_BPM_1x1_structural.fits"
bpm_good_value = 1
bpm_coordinates = "active"
amplifier_id = "explicit-whole-detector"

[provenance]
primary = ["MJD-OBS", "MJD-END", "DATE-OBS", "TIMESYS", "EXPTIME", "TELESCOP", "INSTRUME", "PRODCATG"]
detector = ["EXTNAME", "EXTVER", "HIERARCH ESO DET CHIP ID", "HIERARCH ESO DET OUT1 ID"]

