# Four-file bias example. Review paths and native values for the selected project.
bias_recipe_schema_version = 1
project = "project.toml"
detector_toml = "wfi-1x1.toml"
run = "cal/bias/wfi-native-001"

[inputs]
# Replace with the absolute path to your processing list.
list = "/absolute/path/to/wfi-bias.list"

[bias]
detectors = "all"
median_even_handling = "average"
mad = false
ron_pair = [0, 1]
high_sigma = 5.0
input_bpm = "omitted"
amplifier_id = "explicit-whole-detector"

[provenance]
primary = ["MJD-OBS", "DATE-OBS", "TIMESYS", "EXPTIME", "INSTRUME"]
detector = ["EXTNAME", "EXTVER"]

[native.product]
schema_version = 1

[native.product.header]
recipe_key = { value = "HIERARCH ESO MPP", unit = "none" }
dpr_catg_key = { value = "HIERARCH ESO DPR CATG", unit = "none" }
