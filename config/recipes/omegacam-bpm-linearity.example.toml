# Native command from orchestration, after qualification and input review:
# mefpp_recipe cal bpm-linearity --config bpm-linearity.toml --qc false
# Project owns all roots; this template changes no active controls or data.
# Use a fresh empty reduced run and a fresh control-directory basename.
# OCAM CCD65: retained 20-flat sequence and reviewed direct sites.
bpm_linearity_recipe_schema_version = 2
project = "project.toml"
detector_toml = "ocam-1x1.toml"
run = "cal/bpm-linearity/ocam-native-001"
qc = false # omitted defaults to true; CLI overrides this value

[assembly]
reference_detector = "ESO_CCD_#65"

[bpm]
acquisition = "quick"
output_mode = "new"
upper_fraction = 0.85
minimum_span_fraction = 0.15
maximum_pair_difference = 0.02
response_low = 0.5 # default
response_high = 1.5 # default

[inputs]
# Replace with the absolute path to your processing list.
list = "/absolute/path/to/omegacam-linearity.list"

[[detectors]]
detector_id = "ESO_CCD_#65"
# Calibration paths are relative to the project calibration root.
master_bias = "characterization-3e8u07mf/OCAM_MB_CCD65_candidate.fits"
master_hdu = 1
master_sha256 = "b490d75568055fa5cc4a267f79e79e4768c26e220486e40cb6b2bccdcbb2a0c3"
input_bpm = "omitted" # alternatively an explicit calibration path, with bpm_hdu
reference_rois = ["CCD65.near_readout", "CCD65.serial_far", "CCD65.parallel_far", "CCD65.far_corner", "CCD65.center"]
max_loaded_pixels = 206467604
max_rows = 100

# Direct pixel sites; these do not define the rectangular measurement ROIs.
[[detectors.sites]]
roi = "CCD65.near_readout"
x = 384
y = 384

[[detectors.sites]]
roi = "CCD65.serial_far"
x = 1660
y = 384

[[detectors.sites]]
roi = "CCD65.parallel_far"
x = 384
y = 3707

[[detectors.sites]]
roi = "CCD65.far_corner"
x = 1660
y = 3707

[[detectors.sites]]
roi = "CCD65.center"
x = 1022
y = 2045

[preparation]
# Explicit numerical linearity-preparation candidate; normal reduction unchanged.
# Rectangles are FITS 1-based inclusive [xmin, xmax, ymin, ymax].
processing_footprint_schema_version = 1
linearity_preparation_schema_version = 1
instrument = "omegacam"
roi_schema_version = 1
roi_coordinates = "retained-active"
profile_status = "candidate numerical linearity preparation; actual-Mac qualification pending"
source_paf = "mefpp2/ins/mef/config/omegacam.paf"
source_paf_sha256 = "709d65acdeea6c889ed1468cbb3966d5de93ec654ee030032a096ca12624333f"
use_prescan = 0
use_overscan = 1
scan_reject_low = 10
scan_reject_high = 10

[preparation.linearity_preparation]
raw_saturation_adu = 65534.0
reject_bits = 255
mask_encoding = "binary"
binary_good_value = 1
pair_time_tolerance_s = 0.0
with_mad = true
bias_mean_min_adu = 0.0
bias_mean_max_adu = 1000.0
bias_stack_kappa = 2.0
bias_min_frames = 3
high_offset_sigma = 5.0

[[preparation.roi]]
id = "CCD65.near_readout"
detector = "ESO_CCD_#65"
amplifier = "L"
xmin = 129
xmax = 640
ymin = 129
ymax = 640

[[preparation.roi]]
id = "CCD65.serial_far"
detector = "ESO_CCD_#65"
amplifier = "L"
xmin = 1405
xmax = 1916
ymin = 129
ymax = 640

[[preparation.roi]]
id = "CCD65.parallel_far"
detector = "ESO_CCD_#65"
amplifier = "L"
xmin = 129
xmax = 640
ymin = 3452
ymax = 3963

[[preparation.roi]]
id = "CCD65.far_corner"
detector = "ESO_CCD_#65"
amplifier = "L"
xmin = 1405
xmax = 1916
ymin = 3452
ymax = 3963

[[preparation.roi]]
id = "CCD65.center"
detector = "ESO_CCD_#65"
amplifier = "L"
xmin = 767
xmax = 1278
ymin = 1790
ymax = 2301

