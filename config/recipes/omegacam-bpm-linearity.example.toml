# Native serial BPM/linearity recipe; Pycavi admits archived metadata only.
# Copy into orchestration and fill the explicit admitted dependency paths.
# Run there: python /path/to/tools/run-bpm-linearity.py --config bpm-linearity.toml
# Add --execute only after reviewing the metadata plan. The reduced run must be
# a fresh empty directory. Existing inputs and prior masks remain read-only.
bpm_linearity_recipe_schema_version = 1
project = "project.toml"
run = "cal/bpm-linearity/run-001"

[native_recipe]
executable = "/path/to/qualified/mefpp_bpm_linearity_recipe"
source_revision = "REPLACE_WITH_QUALIFIED_NATIVE_RECIPE_SOURCE_REVISION"

[assembly]
reference_detector = "ESO_CCD_#65"

[preparation]
detector_toml = "omegacam-1x1.toml"
processing_toml = "omegacam-characterization.toml"

# Illustrative authoring values: use the reviewed acquisition limits for the
# selected data. There are no implicit scientific defaults in the coordinator.
[bpm]
acquisition = "quick"
output_mode = "new"
upper_fraction = 0.85
minimum_span_fraction = 0.15
maximum_pair_difference = 0.02

# Repeat in detector-TOML catalogue order. Only bindings/configuration change
# between OmegaCAM and WFI; no instrument-specific recipe implementation.
[[detectors]]
detector_id = "ESO_CCD_#65"
source_samples = "../reduced/cal/bpm-linearity/prior/CCD65/samples.asdf"
handoff = "../reduced/cal/bias/prior/CCD65/handoff.json"
reference_rois = ["REPLACE_WITH_REVIEWED_REFERENCE_ROI_ID"]

# Optional historical calibration copy. path is relative to the project's
# calibration root; source and SHA256 must match the unchanged source archive.
# Prepare the byte-identical copy before metadata admission.
# [[calibration_bindings]]
# source = "/original/retained/OCAM_MB_CCD65_candidate.fits"
# path = "imports/CCD65/OCAM_MB_CCD65_candidate.fits"
# sha256 = "REPLACE_WITH_PRESERVED_CALIBRATION_SHA256"
