[build-system]
requires = [ "setuptools", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "pycavi"
version = "0.1.0"
description = "Python calibration, association, and reduction of visual images."
dependencies = [ "sympy==1.12", 
                "ephem==4.1.2", 
                "astroplan==0.10",
                "astropy==6.1.1",
                "astroquery==0.4.7", 
                "pykrige==1.7.1", 
                "photutils==1.8.0", 
                "matplotlib==3.8.0", 
                "pandas==2.1.4", 
                "pathlib==1.0.1", 
                "scipy==1.12.0", 
                "lmfit==1.3.2", 
                "numpy==1.26.3"]
requires-python = ">=3.9"

[[project.authors]]
name = "Your Name"
email = "your.email@example.com"

[project.scripts]
pycavi_setup = "pycavi.pycavi_setup:setup_pycavi"
#01_mefpp_associate_and_reduce = "scripts.01_mefpp_associate_and_reduce:main"
#02_mefpp_astrometry_solve_field = "scripts.02_mefpp_astrometry_solve_field:main"
#03_mefpp_astrometry_scamp = "scripts.03_mefpp_astrometry_scamp:main"
#04_mefpp_swarp = "scripts.04_mefpp_swarp:main"
#05_mefpp_calibration = "scripts.05_mefpp_calibration:main"

[project.license]
file = "LICENSE"

[tool.setuptools]
packages = ["pycavi", "pycavi.pycavi", "pycavi.papi"]
include-package-data = true

[tool.setuptools.package-data]
"pycavi.config" = [ "*.txt", "*.json", "*.paf", "*.cfg"]
"pycavi.data" = [ "*.csv", "*.json"]
"pycavi.notebooks" = ["*.ipynb"]
