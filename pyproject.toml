[build-system]
requires = [ "setuptools", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "pycavi"
version = "0.1.0"
description = "Python calibration, association, and reduction of visual images."
dependencies = [ "sympy>=1.12, <2.0", 
                "ephem>=4.1.2, <5.0", 
                "astroplan>=0.10, <1.0",
                "astropy>=6.1.1, <7.0",
                "astroquery>=0.4.7, <1.0", 
                "pykrige>=1.7.1, <2.0", 
                "photutils>=1.8.0, <2.0", 
                "matplotlib>=3.8.0, <4.0", 
                "pandas>=2.1.4, <3.0", 
                "scipy>=1.12.0, <2.0", 
                "lmfit>=1.3.2, <2.0", 
                "numpy>=1.26.3, <2.0",
                "ipython>=8",
                "scikit-image>=0.19"]
requires-python = ">=3.10, <3.13"
readme = "README.md"

authors =[
        { name = "Fernando Selman", email = "fselman@eso.org"},
        { name = "Lientur Celedon", email = "lceledonpichun@gmail.com"}
]

maintainers = [
        { name = "Fernando Selman", email = "fselman@eso.org"},
        { name = "Lientur Celedon", email = "lceledonpichun@gmail.com"}
]

[project.scripts]
pycavi = "pycavi.pycavi_project:main"
pycavi_setup = "pycavi.pycavi_setup:main"
pycavi_setastro = "pycavi.pycavi_setastro:main"
[project.optional-dependencies]
notebooks = ["notebook>=6,<8", "ipykernel>=6,<7"]

[tool.setuptools]
package-dir = {"" = "Pycavi2"}
packages = ["pycavi", "pycavi.pycavi", "pycavi.papi", "pycavi.config", "pycavi.data", "pycavi.notebooks"]
include-package-data = true

[tool.setuptools.package-data]
pycavi = ["config/*.cfg", "config/*.paf", "data/*.csv", "data/0readme", "notebooks/*.ipynb"]
